[project]
name = "crosshair-print"
version = "2.0.0"
description = "Turn images into true-scale sketchbook PDFs: exact physical sizing, guide overlays, facing blank pages, and binding-ready imposition (macOS)."
requires-python = ">=3.10"
dependencies = ["Pillow", "reportlab"]

[project.scripts]
crosshair = "crosshair_print:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["crosshair_print"]
